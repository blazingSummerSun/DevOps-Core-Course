# Promtail 3.0 Configuration — Docker log collection
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      # Extract container name (delete leading /)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: "container"
      # Extract label "app" from Docker-container
      - source_labels: ["__meta_docker_container_label_app"]
        target_label: "app"
      # Extract label "logging" from Docker-container
      - source_labels: ["__meta_docker_container_label_logging"]
        target_label: "logging"
      # Set up name job by container name
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: "job"