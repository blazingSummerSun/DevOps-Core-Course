apiVersion: v1
kind: Pod
metadata:
  name: init-demo-pod
spec:
  initContainers:
    - name: init-download
      image: busybox:1.36
      command: ['sh', '-c', 'wget -O /work-dir/index.html https://example.com']
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
    - name: wait-for-service
      image: busybox:1.36
      command: ['sh', '-c', 'until nslookup kubernetes.default.svc.cluster.local; do echo waiting for k8s; sleep 2; done']
  containers:
    - name: main-app
      image: nginx:alpine
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html
      ports:
        - containerPort: 80
  volumes:
    - name: workdir
      emptyDir: {}