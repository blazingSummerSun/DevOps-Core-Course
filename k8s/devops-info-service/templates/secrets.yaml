{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ ternary .Values.secret.nameOverride (printf "%s-secret" (include "devops-info-service.fullname" .)) (ne .Values.secret.nameOverride "") | quote }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.secret.data.username | quote }}
  password: {{ .Values.secret.data.password | quote }}
{{- end }}