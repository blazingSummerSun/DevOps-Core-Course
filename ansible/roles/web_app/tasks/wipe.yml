---
# Wipe logic for the web application.
#
# Safety mechanism:
# This task requires BOTH:
#   1) the tag "web_app_wipe"
#   2) variable web_app_wipe=true
#
# This double confirmation prevents accidental deletion of the application
# during normal deployments.

- name: Wipe web application
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove containers (Docker Compose v2)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"
